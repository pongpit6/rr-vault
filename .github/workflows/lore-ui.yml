name: Lore UI checks
on:
  pull_request:
    paths:
      - 'src/components/**'
      - 'src/screens/VaultRpg.jsx'
      - 'src/lib/worldLore*'
      - 'src/lib/farm.js'
      - 'tests/**'
      - '.github/workflows/lore-ui.yml'
permissions:
  contents: read
jobs:
  lore-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/check-lore.mjs
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Check reading and gameplay controls on mobile and desktop
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/lore-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4173/tests/lore-preview.html > /dev/null; then break; fi
            sleep 1
          done
          node tests/lore-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lore-ui-screenshots
          path: test-results/
          if-no-files-found: ignore
